# Optional: run the Next.js frontend (open-quran) in a container.
# Requires adelpro/open-quran cloned next to this repo:
#   git clone https://github.com/adelpro/open-quran.git ../open-quran
# Run: docker compose -f docker-compose.yml -f docker-compose.web.yml up -d
services:
  web:
    build:
      context: ../open-quran
      dockerfile: Dockerfile
    container_name: open-tilawa-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks: [open-tilawa]
