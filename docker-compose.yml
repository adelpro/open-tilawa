services:
  edge:
    image: nginx:alpine
    container_name: open-tilawa-edge
    ports:
      - "127.0.0.1:${EDGE_PORT:-8084}:80"
    volumes:
      - ./edge/templates:/etc/nginx/templates:ro
    environment:
      TRACKER_PORT: ${TRACKER_PORT:-8083}
      TRACKER_PATH: ${TRACKER_PATH:-/}
    depends_on:
      tracker:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks: [open-tilawa]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: open-tilawa-web
    restart: unless-stopped
    volumes:
      - seed_torrents:/usr/share/nginx/html/torrents:ro
    networks: [open-tilawa]

  tracker:
    build:
      context: .
      dockerfile: apps/tracker/Dockerfile
    container_name: open-tilawa-tracker
    environment:
      PORT: ${TRACKER_PORT:-8083}
    ports:
      - "127.0.0.1:${TRACKER_PORT:-8083}:${TRACKER_PORT:-8083}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8083}/stats >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks: [open-tilawa]

  seeder:
    build:
      context: .
      dockerfile: apps/seeder/Dockerfile
    container_name: open-tilawa-seeder
    env_file:
      - path: .env
        required: false
    environment:
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-3}
      MAGNETS_URL: ${MAGNETS_URL:-https://tilawa.quran.us.kg/api/magnet-uris}
      DOWNLOAD_PATH: /data/downloads
      TORRENT_DIR: /data/torrents
      ADMIN_PORT: ${ADMIN_PORT:-8085}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-change-me-in-prod}
    volumes:
      - seed_downloads:/data/downloads
      - seed_torrents:/data/torrents
    ports:
      - "8085:8085" 
    depends_on:
      tracker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "seed-all.mjs"]
    restart: unless-stopped
    networks: [open-tilawa]


  admin-api:
    build:
      context: ./apps/admin
      dockerfile: apps/api/Dockerfile
    container_name: open-tilawa-admin-api
    env_file:
      - path: ./apps/admin/.env
        required: false
    environment:
      PORT: ${ADMIN_API_PORT:-9410}
      DB_PATH: /data/tilawa-admin.sqlite
      USLUB_VENDOR_DIR: /app/vendor
      CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-https://admin-tilawa.quran.us.kg}
    volumes:
      - admin_data:/data
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-9410}:${ADMIN_API_PORT:-9410}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ADMIN_API_PORT:-9410}/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks: [open-tilawa]

  admin-web:
    build:
      context: ./apps/admin
      dockerfile: apps/web/Dockerfile
    container_name: open-tilawa-admin-web
    restart: unless-stopped
    networks: [open-tilawa]

  admin-edge:
    image: nginx:alpine
    container_name: open-tilawa-admin-edge
    ports:
      - "127.0.0.1:${ADMIN_EDGE_PORT:-9400}:80"
    volumes:
      - ./apps/admin/edge/templates:/etc/nginx/templates:ro
    environment:
      API_PORT: ${ADMIN_API_PORT:-9410}
      WEB_PORT: 80
    depends_on:
      admin-api:
        condition: service_healthy
      admin-web:
        condition: service_started
    restart: unless-stopped
    networks: [open-tilawa]

volumes:
  seed_downloads:
  seed_torrents:
  admin_data:

networks:
  open-tilawa:
    driver: bridge
