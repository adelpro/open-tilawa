# The production stack. The project name is pinned because Compose derives
# container, network and *volume* names from it: naming this `tilawa` would
# orphan open-tilawa_seed_downloads (32 GB of audio) and open-tilawa_admin_data
# (the catalogue), and Compose would quietly create two fresh empty volumes in
# their place. Staging gets its own project name for the same reason — see
# docker-compose.staging.yml.
name: open-tilawa

services:
  edge:
    image: nginx:alpine
    container_name: open-tilawa-edge
    ports:
      - "127.0.0.1:${EDGE_PORT:-8084}:80"
    volumes:
      - ./edge/templates:/etc/nginx/templates:ro
    environment:
      TRACKER_PORT: ${TRACKER_PORT:-8083}
      TRACKER_PATH: ${TRACKER_PATH:-/}
    depends_on:
      tracker:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks: [open-tilawa]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: open-tilawa-web
    restart: unless-stopped
    volumes:
      - seed_torrents:/usr/share/nginx/html/torrents:ro
      # The web seed's payload: the same folders the node seeds, served as-is.
      - seed_downloads:/usr/share/nginx/html/media:ro
    networks: [open-tilawa]

  tracker:
    build:
      context: .
      dockerfile: apps/tracker/Dockerfile
    container_name: open-tilawa-tracker
    environment:
      PORT: ${TRACKER_PORT:-8083}
    ports:
      - "127.0.0.1:${TRACKER_PORT:-8083}:${TRACKER_PORT:-8083}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8083}/stats >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks: [open-tilawa]

  seeder:
    # Registry image for a fleet; `build` stays so a checkout can run a node
    # without publishing first. SEEDER_IMAGE lets a host pin a tag or digest.
    image: ${SEEDER_IMAGE:-ghcr.io/adelpro/open-tilawa-seeder:latest}
    build:
      context: .
      dockerfile: apps/seeder/Dockerfile
    container_name: open-tilawa-seeder
    env_file:
      - path: .env
        required: false
    environment:
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-3}
      MAGNETS_URL: ${MAGNETS_URL:-https://tilawa.quran.us.kg/api/magnet-uris}
      DOWNLOAD_PATH: /data/downloads
      TORRENT_DIR: /data/torrents
      ADMIN_PORT: ${ADMIN_PORT:-8085}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS}
      # 0 = unlimited; the node enforces its own quota and bandwidth caps.
      DISK_QUOTA_GB: ${DISK_QUOTA_GB:-0}
      UPLOAD_LIMIT_KBPS: ${UPLOAD_LIMIT_KBPS:-0}
      DOWNLOAD_LIMIT_KBPS: ${DOWNLOAD_LIMIT_KBPS:-0}
      ADMIN_UI: ${ADMIN_UI:-1}
    volumes:
      - seed_downloads:/data/downloads
      - seed_torrents:/data/torrents
    ports:
      # Loopback only: the dashboard reaches the seeder over the compose network,
      # so the admin API (which can add and delete torrents) has no business on
      # every interface.
      - "127.0.0.1:8085:8085" 
      # Inbound peers. Without these the node only ever dials out, so peers that
      # cannot reach it see one fewer seeder for the same content.
      - "6881:6881/tcp"
      - "6881:6881/udp"
    depends_on:
      tracker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "seed-all.mjs"]
    restart: unless-stopped
    networks: [open-tilawa]


  admin-api:
    build:
      context: ./apps/admin
      dockerfile: apps/api/Dockerfile
    container_name: open-tilawa-admin-api
    env_file:
      - path: ./apps/admin/.env
        required: false
    environment:
      # The app must not run with development defaults (non-secure cookies, no
      # secret enforcement) in production; .env still supplies the secrets.
      NODE_ENV: production
      # Which commit this container runs; `/health` prints it. Set GIT_SHA when
      # deploying a release, or leave it "dev" for a working-tree build.
      BUILD_SHA: ${GIT_SHA:-dev}
      PORT: ${ADMIN_API_PORT:-9410}
      DB_PATH: /data/tilawa-admin.sqlite
      CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-https://admin-tilawa.quran.us.kg}
      # Absolute origin used in activation and reset mail. Overridden here so a
      # developer's .env (`http://localhost:9400`) cannot leak into emails sent
      # from production.
      WEBSITE: ${ADMIN_WEBSITE:-https://admin-tilawa.quran.us.kg}
      # Seeder updates run through the host daemon (see the socket mount below).
      SEEDER_UPDATE: "1"
      SEEDER_COMPOSE_FILE: /host/docker-compose.yml
      SEEDER_COMPOSE_PROJECT: open-tilawa
      SEEDER_SERVICE: seeder
      # This host builds from the mounted tree; registry-based nodes use `pull`.
      SEEDER_UPDATE_MODE: build
    # The socket is owned by root:988; the container's `node` user only needs
    # to be in that group, not to run as root.
    group_add: ["${DOCKER_GID:-988}"]
    volumes:
      - admin_data:/data
      # A socket mount is root-equivalent on the host — that is the cost of
      # "update the seeder from the dashboard", and it is why the endpoint is
      # admin-only, CSRF-guarded, audited, and fixed to one compose service.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only source tree: the compose file and the seeder build context.
      - ./:/host:ro
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-9410}:${ADMIN_API_PORT:-9410}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ADMIN_API_PORT:-9410}/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    networks: [open-tilawa]

  admin-web:
    build:
      context: ./apps/admin
      dockerfile: apps/web/Dockerfile
    container_name: open-tilawa-admin-web
    restart: unless-stopped
    networks: [open-tilawa]

  admin-edge:
    image: nginx:alpine
    container_name: open-tilawa-admin-edge
    ports:
      - "127.0.0.1:${ADMIN_EDGE_PORT:-9400}:80"
    volumes:
      - ./apps/admin/edge/templates:/etc/nginx/templates:ro
    environment:
      API_PORT: ${ADMIN_API_PORT:-9410}
      WEB_PORT: 80
    depends_on:
      admin-api:
        condition: service_healthy
      admin-web:
        condition: service_started
    restart: unless-stopped
    networks: [open-tilawa]

volumes:
  seed_downloads:
  seed_torrents:
  admin_data:

networks:
  open-tilawa:
    driver: bridge
