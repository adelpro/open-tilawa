# Staging deployment for open-tilawa.
#
# Its own Compose project, so its `edge`, `web` and `tracker` cannot be mistaken
# for production's. Before this line existed both files belonged to project
# `open-tilawa`, and Compose identifies a container by project *and* service — so
# deploying staging replaced the production containers with the staging ones and
# left https://tilawa.quran.us.kg with nothing behind it (502).
#
# Its own env file too, not a `STAGING_*` prefix inside `.env`:
#
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
#
# Same variable names as production (`EDGE_PORT`, `TRACKER_PORT`), different
# values. One name, one file, one owner.
name: open-tilawa-staging

services:
  edge:
    image: nginx:alpine
    container_name: open-tilawa-staging-edge
    ports:
      - "127.0.0.1:${EDGE_PORT:-8086}:80"
    volumes:
      - ./edge/templates:/etc/nginx/templates:ro
    environment:
      # The tracker image's CMD pins `--port 8083`, so this is the port the edge
      # must dial inside the network — it is not the host port. Written as a
      # literal on purpose: `${TRACKER_PORT}` here would resolve to 8087 from
      # .env.staging and the edge would proxy to a closed socket.
      TRACKER_PORT: 8083
      TRACKER_PATH: ${TRACKER_PATH:-/}
    depends_on:
      - tracker
      - web
    restart: unless-stopped
    networks: [open-tilawa-staging]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: open-tilawa-staging-web
    restart: unless-stopped
    volumes:
      - seed_torrents_staging:/usr/share/nginx/html/torrents:ro
      - seed_downloads_staging:/usr/share/nginx/html/media:ro
    networks: [open-tilawa-staging]

  tracker:
    build:
      context: .
      dockerfile: apps/tracker/Dockerfile
    container_name: open-tilawa-staging-tracker
    environment:
      # Pinned by the image's CMD (`--port 8083`); publishing any other container
      # port would map the host to a closed socket, which is what 8087:8087 did.
      PORT: 8083
    ports:
      - "127.0.0.1:${TRACKER_PORT:-8087}:8083"
    restart: unless-stopped
    networks: [open-tilawa-staging]

networks:
  open-tilawa-staging:
    driver: bridge

volumes:
  seed_torrents_staging:
  seed_downloads_staging:
