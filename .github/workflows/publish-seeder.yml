name: Publish Seeder Image

on:
  push:
    branches: [main]
    paths:
      - 'apps/seeder/**'
      - 'deploy-node.sh'
      - '.github/workflows/publish-seeder.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/seeder/Dockerfile
          push: true
          # Seeders are often ARM single-board computers; an amd64-only image
          # silently fails to start there.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/adelpro/open-tilawa-seeder:latest
            ghcr.io/adelpro/open-tilawa-seeder:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/adelpro/open-tilawa-seeder:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
