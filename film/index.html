<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تلاوة — الصفحة التي ترسم الصوت</title>
<style>
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('brand/fonts/ibm-plex-sans-arabic-400.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('brand/fonts/ibm-plex-sans-arabic-600.woff2') format('woff2');font-weight:600;font-display:block}
  :root{ --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#e8e8e8; --wave-front:#1c4d78; --wave-back:#5d97c9; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e9e9}
  #main{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);
    font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);margin:0 auto}
  .cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
  .page{position:absolute;inset:0}

  .title{position:absolute;left:0;right:0;top:237.6px;height:84px;display:flex;align-items:center;justify-content:center;gap:12px;
    font-size:56px;font-weight:600;letter-spacing:-0.02em;color:var(--ink)}
  .title .chev{color:var(--muted);opacity:.30;display:flex}
  .reciter{position:absolute;left:0;right:0;top:309.6px;height:24px;display:flex;align-items:center;justify-content:center;gap:8px;
    margin:0;font-size:16px;color:var(--muted)}
  .reciter .chev{opacity:.30;display:flex}

  .col{position:absolute;inset:0}
  .ribbon{position:absolute;left:700px;top:683px;width:520px;height:160px}
  .ribbon svg{display:block}
  .scrub{position:absolute;left:680px;top:860px;width:560px;height:44px;display:flex;align-items:center;gap:12px;direction:rtl}
  .scrub .t{width:44px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
  .scrub .rail{position:relative;flex:1;height:3px;border-radius:999px;background:var(--line)}
  .scrub .rail i{position:absolute;inset-block:0;right:0;border-radius:999px;background:var(--ink)}

  .transport{position:absolute;left:0;right:0;top:919px;height:72px;display:flex;align-items:center;justify-content:center;gap:8px}
  .transport .ghost{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
  .transport .play{width:72px;height:72px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 4px}

  .foot{position:absolute;left:0;right:0;top:1023px;height:57px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .foot .in{width:520px;display:flex;align-items:center;gap:4px}
  .foot .names{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .foot .names b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .foot .names span{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .foot .btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .foot .ring{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .foot .ring svg.track{position:absolute;inset:0;transform:rotate(-90deg)}
  .foot .ring .glyph{position:relative;color:var(--muted);display:flex}

  /* roster, docked right */
  .panel{position:absolute;top:56px;bottom:0;right:0;width:360px;background:#fff;border-left:1px solid var(--line);
    display:flex;flex-direction:column;box-shadow:-12px 0 24px rgba(17,17,17,.04);will-change:transform}
  .panel .head{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 16px}
  .panel .head h2{margin:0;font-size:16px;font-weight:600}
  .panel .head .acts{display:flex;gap:4px;color:var(--muted)}
  .panel .head .acts span{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .panel .search{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:16px}
  .panel .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .panel .chips i{font-style:normal;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);white-space:nowrap}
  .panel .chips i.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .panel ul{list-style:none;margin:0;padding:0}
  .panel li{display:flex;align-items:center;min-height:64px;padding:8px 16px}
  .panel li .row{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
  .panel li .txt{flex:1;min-width:0}
  .panel li .nm{display:block;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel li.cur .nm{font-weight:600}
  .panel li .meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}
  .panel li .pill{flex:none;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
  .panel li .heart{width:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}

  .cursor{position:absolute;left:0;top:0;width:22px;height:29px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
  .mark{position:absolute;top:165px;left:50%;width:538px;transform:translateX(-50%);will-change:transform,filter}
  .mark img{display:block;width:100%}

  .url{position:absolute;top:438px;left:0;right:0;text-align:center;direction:ltr;font-size:28px;letter-spacing:.06em;color:var(--muted);opacity:0}
  .light{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(120% 85% at 22% -12%, rgba(20,30,45,.028), rgba(20,30,45,0) 58%),
    radial-gradient(95% 70% at 104% 112%, rgba(20,30,45,.014), rgba(20,30,45,0) 60%)}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.055'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='520' height='520' filter='url(%23m)' opacity='0.018'/></svg>")}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="21">
  <div class="cam" id="cam">
    <div class="page" data-ui="captured">
      <div class="title" id="title">الفاتحة<span class="chev" id="i-chev-title"></span></div>
      <p class="reciter" id="reciter">محمد صديق المنشاوي<span class="chev" id="i-chev-rec"></span></p>

      <div class="col" id="col">
        <div class="ribbon" id="ribbon"></div>
        <div class="scrub">
          <span class="t" id="pos">0:02</span>
          <span class="rail"><i id="fill" style="width:4%"></i></span>
          <span class="t" id="dur">0:51</span>
        </div>
        <div class="transport">
          <span class="ghost" id="i-prev"></span>
          <span class="ghost" dir="ltr">−15</span>
          <span class="play" id="i-play"></span>
          <span class="ghost" dir="ltr">+15</span>
          <span class="ghost" id="i-next"></span>
        </div>
      </div>

      <div class="foot"><div class="in">
        <div class="names">
          <b id="i-book">الفاتحة</b>
          <span id="i-mic">محمد صديق المنشاوي</span>
        </div>
        <span class="btn" id="i-vol"></span>
        <span class="ring">
          <svg class="track" viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-opacity=".22" stroke-width="2"/><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="62"/></svg>
          <span class="glyph" id="i-wifi"></span>
        </span>
      </div></div>

      <aside class="panel" id="panel">
        <div class="head"><h2>القرّاء</h2><div class="acts"><span id="i-pin"></span><span id="i-close"></span></div></div>
        <div class="search"><span style="flex:1">ابحث باسم القارئ</span><span id="i-search"></span></div>
        <div class="chips"><i class="on">الكل</i><i>ورش</i><i>حفص</i><i>قالون</i><i>al-Douri</i></div>
        <div class="chips"><i class="on">الافتراضي</i><i>مفضّلاتي</i><i>آخر ما استمعت</i><i>الأكثر تفضيلاً</i><i>الأكثر استماعاً</i></div>
        <ul id="rows"></ul>
      </aside>
    </div>
    <svg class="cursor" id="cursor" viewBox="0 0 26 34"><path d="M3 1.5 L3 25.5 L9.1 19.9 L13.1 29.6 L17.4 27.8 L13.5 18.3 L21.7 18.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>

  <div class="mark" id="mark"><img src="brand/logo/logo.png" alt="تلاوة"></div>
  <div class="url" id="url">tilawah.cc</div>
  <div class="light"></div>
  <div class="grain"></div>
</div>

<script src="src/icons.js"></script>
<script src="src/peaks-film.js"></script>
<script src="src/ribbon-21.js"></script>
<script src="src/spectrum.js"></script>
<script>
const W = 520, H = 160, POINTS = 240, FPS = 30, DUR = 21, SEAM = 10.0;

function icon(name, size){ const d = (window.ICONS[name]||[''])[0]; return `<svg viewBox="0 0 256 256" width="${size}" height="${size}" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`; }

/* icons */
document.getElementById('i-chev-title').innerHTML = icon('CaretDown', 20);
document.getElementById('i-chev-rec').innerHTML = icon('CaretDown', 20);
document.getElementById('i-prev').innerHTML = icon('CaretRight', 20);
document.getElementById('i-next').innerHTML = icon('CaretLeft', 20);
document.getElementById('i-play').innerHTML = icon('Pause', 24);
document.getElementById('i-vol').innerHTML = icon('SpeakerHigh', 20);
document.getElementById('i-wifi').innerHTML = icon('WifiHigh', 16);
document.getElementById('i-pin').innerHTML = icon('PushPin', 20);
document.getElementById('i-close').innerHTML = icon('X', 20);
document.getElementById('i-search').innerHTML = icon('MagnifyingGlass', 20);
document.getElementById('i-book').innerHTML = icon('BookOpen', 20) + 'الفاتحة';
document.getElementById('i-mic').innerHTML = icon('Microphone', 16) + '<span id="micName">محمد صديق المنشاوي</span>';

/* roster — real catalogue rows and counts */
const ROWS = [
  { name:'ياسين الجزائري (ورش)', riwaya:'ورش', fav:4, views:31 },
  { name:'عبد الباسط عبد الصمد (مجوّد)', riwaya:'حفص', fav:0, views:10 },
  { name:'ماهر المعيقلي', riwaya:'حفص', fav:0, views:1 },
  { name:'عبد الله بصفر', riwaya:'حفص', fav:0, views:0 },
  { name:'محمود خليل الحصري', riwaya:'حفص', fav:1, views:0 },
  { name:'محمد صديق المنشاوي', riwaya:'حفص', fav:0, views:0 },
  { name:'مفتاح السلطني (ورش)', riwaya:'ورش', fav:0, views:0 },
  { name:'صابر عبد الحكم (ورش)', riwaya:'ورش', fav:0, views:1 },
  { name:'مفتاح السلطني (قالون)', riwaya:'قالون', fav:0, views:0 },
  { name:'صابر عبد الحكم (الدوري)', riwaya:'al-Douri', fav:0, views:0 },
];
const rowsEl = document.getElementById('rows');
rowsEl.innerHTML = ROWS.map((r, i) => `
  <li data-i="${i}">
    <div class="row">
      <span class="txt"><span class="nm">${r.name}</span>
        <span class="meta"><span>كامل</span>
          <span style="display:inline-flex;align-items:center;gap:4px">${icon('Heart',16)}<span>${r.fav}</span></span>
          <span style="display:inline-flex;align-items:center;gap:4px">${icon('Headphones',16)}<span>${r.views}</span></span>
        </span>
      </span>
      <span class="pill">${r.riwaya}</span>
    </div>
    <span class="heart">${icon('Heart',20)}</span>
  </li>`).join('');
const rowEls = [...rowsEl.children];

/* the spectrum: bars (`peaks`) or waves (`ribbon`), chosen by ?mode= — see src/spectrum.js */
Spectrum.init(document.getElementById('ribbon'));

/* ---------- time ---------- */
const cam = document.getElementById('cam');
const col = document.getElementById('col');
const panel = document.getElementById('panel');
const cursor = document.getElementById('cursor');
const mark = document.getElementById('mark');
const urlEl = document.getElementById('url');
const posEl = document.getElementById('pos');
const fillEl = document.getElementById('fill');
const durEl = document.getElementById('dur');
const reciterEl = document.getElementById('reciter');
const micEl = document.getElementById('micName');

const clamp01 = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = x => Math.pow(clamp01(x), 3);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2; };

const CAM = [
  /* B1 0–4.20 */ t => { const k = easeOut(t/4.20); return [1.30 - 0.14*k, 960, 556]; },
];
function cameraAt(t){
  /* 0–7.20 one continuous camera: pull back, turn around, push in */
  if (t < 3.40){ const k = easeOut(t/3.40); return [1.30 - 0.14*k, 960, 600 - 44*k]; }
  if (t < 7.20){ const k = easeInOut((t-3.40)/3.80); return [1.16 + 2.04*k, 960 - 10*k, 556 + 129*k]; }
  if (t < 10.0){
    if (t < 7.75) return [1.00, 960, 480];
    if (t < 8.55){ const k = easeInOut((t-7.75)/0.80); return [1.00 + 2.20*k, 960 + 780*k, 480 + 120*k]; }
    if (t < 9.30){ const k = (t-8.55)/0.75; return [3.20 + 0.05*k, 1740, 600]; }
    const k = easeIn((t-9.30)/0.48);
    return [3.25 + (1.00-3.25)*k, 1740 + (960-1740)*k, 600 + (480-600)*k];
  }
  if (t < 17.0){
    if (t < 13.0){ const k = easeInOut((t-10.0)/3.0); return [1.00 + 3.20*k, 960 - 8*k, 480 + 250*k]; }
    const k = (t-13.0)/4.0;
    return [4.20 + 0.04*k, 952, 730 - 7*k];
  }
  const k = (t-17.0)/4.0;
  return [2.60 + 0.02*k, 960, 704 - 3*k];
}

function mmss(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}`; }

function seek(t){
  t = Math.max(0, Math.min(DUR - 1e-4, t));
  const f = Math.round(t * FPS);

  /* camera */
  const [s, fx, fy] = cameraAt(t);
  cam.style.transform = `translate(960px,540px) scale(${s.toFixed(4)}) translate(${-fx.toFixed(2)}px,${-fy.toFixed(2)}px)`;

  /* roster dock: in 7.20–7.75, out 9.30–9.85 */
  let px = 360, shift = 0;
  if (t >= 7.20 && t < 9.30){
    const k = easeOut((t - 7.20)/0.55);
    px = 360*(1-k); shift = -180*k;
  } else if (t >= 9.30 && t < 10.0){
    const k = easeIn((t - 9.30)/0.50);
    px = 360*k; shift = -180*(1-k);
  }
  panel.style.transform = `translateX(${px.toFixed(1)}px)`;
  col.style.transform = `translateX(${shift.toFixed(1)}px)`;

  /* the pick */
  const picked = t >= 9.08;
  rowEls.forEach((el, i) => {
    const cur = picked ? i === 4 : i === 5;
    el.classList.toggle('cur', cur);
  });
  const name = picked ? 'محمود خليل الحصري' : 'محمد صديق المنشاوي';
  reciterEl.firstChild.nodeValue = name;
  micEl.textContent = name;

  /* cursor (page space) */
  if (t >= 8.20 && t < 9.80){
    let cx, cy;
    if (t < 8.85){ const k = easeOut((t-8.20)/0.65); cx = 1980 + (1690-1980)*k; cy = 760 + (585-760)*k; }
    else if (t < 9.06){ cx = 1690; cy = 585; }
    else { const k = easeIn((t-9.06)/0.74); cx = 1690 + (2120-1690)*k; cy = 585 + (320-585)*k; }
    let sc = 1;
    if (t >= 9.06 && t < 9.16) sc = 1 - 0.10*Math.sin(Math.PI*(t-9.06)/0.10);
    cursor.style.display = 'block';
    cursor.style.transform = `translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) scale(${sc.toFixed(3)})`;
  } else {
    cursor.style.display = 'none';
  }

  /* clock — the real file's position and length */
  const audio = t < SEAM ? 2.00 + t : 16.18 + (t - SEAM);
  const total = t < SEAM ? 51.3 : 34.25;
  posEl.textContent = mmss(audio);
  durEl.textContent = mmss(total);
  fillEl.style.width = ((audio/total)*100).toFixed(1) + '%';

  /* the mark: 19.55 → 20.17, then a creep */
  if (t >= 19.55){
    const k = easeOut((t-19.55)/0.62);
    const creep = Math.min(1, Math.max(0, (t-20.17)/0.83));
    mark.style.opacity = 1;
    mark.style.transform = `translateX(-50%) scale(${(1.18 - 0.18*k - 0.004*creep).toFixed(4)})`;
    mark.style.filter = k < 0.999 ? `blur(${(6*(1-k)).toFixed(2)}px)` : 'none';
  } else {
    mark.style.opacity = 0;
  }
  /* the address, once the name has settled */
  urlEl.style.opacity = easeOut((t - 20.30) / 0.50).toFixed(3);

  Spectrum.draw(t);
}

window.__seek = seek;
window.__duration = DUR;
window.__events = [
  { t: 7.20, frame: 216, type: 'cut', label: 'page → roster' },
  { t: 9.08, frame: 272, type: 'press', label: 'pick الحصري' },
  { t: 10.00, frame: 300, type: 'beat', label: 'V2 begins' },
  { t: 17.00, frame: 510, type: 'cut', label: 'macro → close' },
  { t: 19.55, frame: 587, type: 'show', label: 'wordmark' },
  { t: 20.30, frame: 609, type: 'show', label: 'tilawah.cc' },
];
seek(0);
</script>
</body>
</html>
