<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تلاوة — mobile intro (9:16)</title>
<style>
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('brand/fonts/ibm-plex-sans-arabic-400.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'IBM Plex Sans Arabic';src:url('brand/fonts/ibm-plex-sans-arabic-600.woff2') format('woff2');font-weight:600;font-display:block}
  :root{ --bg:#fff; --ink:#111; --muted:#6b6b6b; --line:#e8e8e8; --wave-front:#1c4d78; --wave-back:#5d97c9; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e9e9}
  #main{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
    font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);margin:0 auto}
  .cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}

  /* ---------- the phone ---------- */
  .phone{position:absolute;left:212px;top:300px;width:656px;height:1378px;will-change:transform,filter}
  .body{position:absolute;inset:0;border-radius:96px;background:#0b0b0c;
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 -1px 0 rgba(255,255,255,.06) inset,
               0 40px 60px -30px rgba(17,17,17,.28), 0 90px 120px -60px rgba(17,17,17,.18)}
  .body::after{content:'';position:absolute;inset:6px;border-radius:90px;border:1px solid rgba(255,255,255,.09)}
  .screen{position:absolute;left:18px;top:18px;width:620px;height:1342px;border-radius:80px;overflow:hidden;background:#fff}
  .island{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:104px;height:32px;border-radius:999px;background:#0b0b0c;z-index:5}

  /* ---------- the app, at 390x844 x 1.59 ---------- */
  .app{position:absolute;inset:0}
  .hdr{position:absolute;inset-inline:0;top:0;height:89px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;border-bottom:1px solid var(--line)}
  .hdr .brand{display:flex;align-items:center;gap:10px}
  .hdr .brand img{height:44px;width:auto;display:block}
  .hdr .ver{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hdr .menu{width:66px;height:66px;display:flex;flex-direction:column;justify-content:center;gap:8px;align-items:flex-start;margin-inline-start:-14px}
  .hdr .menu span{display:block;height:2.5px;width:32px;border-radius:2px;background:currentColor}
  .hdr .menu span:nth-child(2){width:32px}
  .hdr .menu span:nth-child(3){width:32px}

  .ribbon{position:absolute;left:38px;top:438px;width:544px;height:153px}
  .ribbon svg{display:block;width:544px;height:153px}

  .scrub{position:absolute;left:26px;top:654px;width:568px;height:70px;display:flex;align-items:center;gap:16px;direction:rtl}
  .scrub .t{width:62px;font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;direction:ltr}
  .scrub .rail{position:relative;flex:1;height:4px;border-radius:999px;background:var(--line)}
  .scrub .rail i{position:absolute;inset-block:0;right:0;border-radius:999px;background:var(--ink)}

  .transport{position:absolute;inset-inline:0;top:749px;height:115px;display:flex;align-items:center;justify-content:center;gap:12px}
  .transport .ghost{width:70px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:600}
  .transport .play{width:114px;height:114px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 6px}

  .foot{position:absolute;inset-inline:0;bottom:0;height:117px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 26px}
  .foot .in{width:100%;display:flex;align-items:center;gap:8px}
  .foot .names{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .foot .names b{font-size:26px;font-weight:600;display:flex;align-items:center;gap:12px}
  .foot .names span{font-size:22px;color:var(--muted);display:flex;align-items:center;gap:12px}
  .foot .btn{width:70px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .foot .ring{position:relative;width:70px;height:70px;display:flex;align-items:center;justify-content:center}
  .foot .ring svg.track{position:absolute;inset:0;transform:rotate(-90deg)}
  .foot .ring .wifi{position:relative;color:var(--muted)}

  .light{position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(120% 80% at 24% -8%, rgba(20,30,45,.030), rgba(20,30,45,0) 58%)}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.05'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='520' height='520' filter='url(%23m)' opacity='0.016'/></svg>")}
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-width="1080" data-height="1920" data-duration="5.2">
  <div class="cam" id="cam">
    <div class="phone" id="phone">
      <div class="body"></div>
      <div class="screen">
        <div class="island"></div>
        <div class="app">
          <header class="hdr">
            <div class="brand"><img src="brand/logo/logo.png" alt="تلاوة"><span class="ver">1.9.3</span></div>
            <div class="menu"><span></span><span></span><span></span></div>
          </header>
          <div class="ribbon" id="ribbon"></div>
          <div class="scrub">
            <span class="t" id="pos">0:02</span>
            <span class="rail"><i id="fill" style="width:5%"></i></span>
            <span class="t">0:51</span>
          </div>
          <div class="transport">
            <span class="ghost" id="i-prev"></span>
            <span class="ghost" dir="ltr">−15</span>
            <span class="play" id="i-play"></span>
            <span class="ghost" dir="ltr">+15</span>
            <span class="ghost" id="i-next"></span>
          </div>
          <footer class="foot"><div class="in">
            <div class="names">
              <b id="i-book">الفاتحة</b>
              <span id="i-mic">محمد صديق المنشاوي</span>
            </div>
            <span class="btn" id="i-vol"></span>
            <span class="ring">
              <svg class="track" viewBox="0 0 44 44" width="70" height="70"><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-opacity=".22" stroke-width="2"/><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="64"/></svg>
              <span class="wifi" id="i-wifi"></span>
            </span>
          </div></footer>
        </div>
      </div>
    </div>
  </div>
  <div class="light"></div>
  <div class="grain"></div>
</div>

<script src="src/icons.js"></script>
<script src="src/wave-mobile.js"></script>
<script>
const NS = 'http://www.w3.org/2000/svg';
const FRONT = '#1c4d78', BACK = '#5d97c9';
const TINTS = [0, 1/3, 2/3, 1].map(t => mix(FRONT, BACK, t));
const ALPHA = [0.72, 0.55, 0.42, 0.30];
const W = 544, H = 153, POINTS = 240;

function hex(v){ v = v.replace('#',''); return [0,2,4].map(i => parseInt(v.slice(i,i+2),16)); }
function mix(a,b,t){ const A=hex(a),B=hex(b); return '#'+A.map((x,i)=>Math.round(x+(B[i]-x)*Math.min(1,Math.max(0,t))).toString(16).padStart(2,'0')).join(''); }

/* icons */
const svg = (name, size) => `<svg viewBox="0 0 256 256" width="${size}" height="${size}" fill="currentColor"><path d="${(window.ICONS[name]||[''])[0]}"/></svg>`;
document.getElementById('i-prev').innerHTML = svg('CaretRight', 30);
document.getElementById('i-next').innerHTML = svg('CaretLeft', 30);
document.getElementById('i-play').innerHTML = svg('Pause', 40);
document.getElementById('i-vol').innerHTML = svg('SpeakerHigh', 32);
document.getElementById('i-wifi').innerHTML = svg('WifiHigh', 26);
document.getElementById('i-book').insertAdjacentHTML('afterbegin', svg('BookOpen', 30));
document.getElementById('i-mic').insertAdjacentHTML('afterbegin', svg('Microphone', 26));

/* one SVG path per layer, replaced every frame */
const ribbonEl = document.getElementById('ribbon');
const svgEl = document.createElementNS(NS, 'svg');
svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
const paths = [3,2,1,0].map(layer => {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('fill', TINTS[layer]);
  p.setAttribute('fill-opacity', ALPHA[layer]);
  svgEl.appendChild(p);
  return { layer, p };
});
const floorLine = document.createElementNS(NS, 'rect');
floorLine.setAttribute('x', 0); floorLine.setAttribute('y', H - 1);
floorLine.setAttribute('width', W); floorLine.setAttribute('height', 1);
floorLine.setAttribute('fill', '#e8e8e8');
svgEl.appendChild(floorLine);
ribbonEl.appendChild(svgEl);

function drawRibbon(frame){
  const data = window.WMF[Math.max(0, Math.min(window.WMF.length - 1, Math.round(frame)))];
  const step = W / (POINTS - 1), amp = H - 6;
  for (const { layer, p } of paths){
    const arr = data[layer];
    let d = `M ${W} ${H}`;
    for (let i = 0; i < POINTS; i++){
      d += ` L ${(W - i*step).toFixed(2)} ${(H - arr[i]*amp).toFixed(2)}`;
    }
    d += ` L 0 ${H} Z`;
    p.setAttribute('d', d);
  }
}

/* ---------- time ---------- */
const DUR = 5.2;
const cam = document.getElementById('cam');
const phone = document.getElementById('phone');
const posEl = document.getElementById('pos');
const fillEl = document.getElementById('fill');
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const clamp01 = t => Math.max(0, Math.min(1, t));

const RIB_C = { x: 540, y: 960 };   // land on the app screen's middle (header and footer cropped)
const LAND = 1.74;                                // app screen fills the width

function seek(t){
  /* phone: rises from below, decelerating, no bounce */
  const a = clamp01(t / 0.95), e = easeOut(a);
  const y = 340 * (1 - e);
  const sc = 1.04 - 0.04 * e;
  const blur = 8 * (1 - e);
  phone.style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(4)})`;
  phone.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';

  /* camera: still, then a dive into the screen, then a slow creep */
  let s = 1, fy = 960;
  if (t > 2.6 && t <= 3.7){
    const k = easeInOut(clamp01((t - 2.6) / 1.1));
    s = 1 + (LAND - 1) * k;
    fy = 960 + (RIB_C.y - 960) * k;
  } else if (t > 3.7){
    const k = (t - 3.7) / (DUR - 3.7);
    s = LAND + 0.06 * k;
    fy = RIB_C.y + 6 * k;
  }
  cam.style.transform = `translate(540px,960px) scale(${s.toFixed(4)}) translate(${-RIB_C.x}px,${-fy.toFixed(2)}px)`;

  /* app clock */
  const audio = 2.34 + t;
  const mm = Math.floor(audio / 60), ss = Math.floor(audio % 60);
  posEl.textContent = `${mm}:${String(ss).padStart(2, '0')}`;
  fillEl.style.width = ((audio / 51.3) * 100).toFixed(1) + '%';

  drawRibbon(t * 30);
}

window.__seek = seek;
window.__duration = DUR;
seek(0);
</script>
</body>
</html>
