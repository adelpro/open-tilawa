<script>
const NS = 'http://www.w3.org/2000/svg';
const FRONT = '#1c4d78', BACK = '#5d97c9';
const TINTS = [0, 1/3, 2/3, 1].map(t => mixHex(FRONT, BACK, t));
const ALPHA = [0.72, 0.55, 0.42, 0.30];

function parseHex(v){ v = v.replace('#',''); return [0,2,4].map(i => parseInt(v.slice(i,i+2),16)); }
function mixHex(a,b,t){ const A=parseHex(a),B=parseHex(b); return '#'+A.map((x,i)=>Math.round(x+(B[i]-x)*Math.min(1,Math.max(0,t))).toString(16).padStart(2,'0')).join(''); }

function icon(name, size = 20){
  const d = (window.ICONS[name] || [''])[0];
  return `<svg viewBox="0 0 256 256" width="${size}" height="${size}" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
}

/** The one local glyph: three arcs and a dot that answer in turn (globals.css .wifi-arc). */
function wifiWaiting(size = 16, phase = 0.5){
  // phase 0..1 across the 1.5 s cycle; each arc peaks at its own moment.
  const peak = (offset) => {
    let d = (phase - offset + 1) % 1;            // 0 at peak
    const tri = d <= 0.5 ? d / 0.5 : (1 - d) / 0.5;
    return 0.35 + 0.65 * (1 - tri);
  };
  const arc1 = peak(0.5), arc2 = peak(0.833), dot = Math.min(1, 0.6 + 0.4 * (1 - Math.abs(((phase + 0.6) % 0.4) / 0.4)));
  return `<svg class="wifi-bars" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor"
    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4.5 9.5a11 11 0 0 1 15 0" opacity="${arc1.toFixed(2)}"/>
    <path d="M7.8 13a6.5 6.5 0 0 1 8.4 0" opacity="${arc2.toFixed(2)}"/>
    <path d="M10.9 16.4a2.2 2.2 0 0 1 2.2 0" opacity="${dot.toFixed(2)}"/>
  </svg>`;
}

/* the spectrum: `peaks` — 28 bars (index 0 at the right edge, RTL) with the
   floating peak caps above each. Port of visualiser.tsx drawPeaks. */
function drawRibbon(el, data, w = 520, h = 160){
  const BARS = 28, GAP = 3;
  const BW = Math.max(2, (w - GAP * (BARS - 1)) / BARS);
  const xFor = i => w - BW - i * (BW + GAP);
  const hFor = level => Math.pow(level, 0.65) * h;
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.style.display = 'block';
  for (let i = 0; i < BARS; i++){
    const height = hFor(data[i]);
    const b = document.createElementNS(NS,'rect');
    b.setAttribute('x', xFor(i).toFixed(2));
    b.setAttribute('width', BW.toFixed(2));
    b.setAttribute('y', (h - height).toFixed(2));
    b.setAttribute('height', height.toFixed(2));
    b.setAttribute('fill', TINTS[0]);
    svg.appendChild(b);
  }
  for (let i = 0; i < BARS; i++){
    const peak = data[BARS + i];
    if (!(peak > 0)) continue;
    const c = document.createElementNS(NS,'rect');
    c.setAttribute('x', xFor(i).toFixed(2));
    c.setAttribute('width', BW.toFixed(2));
    c.setAttribute('y', (h - hFor(peak) - 2).toFixed(2));
    c.setAttribute('height', 1.5);
    c.setAttribute('fill', TINTS[0]);
    svg.appendChild(c);
  }
  el.appendChild(svg);
}

function scene(cfg){
  const wrap = document.createElement('div');
  wrap.className = 'scene';
  wrap.id = cfg.id;
  const [pm, ps] = cfg.pos.split(':').map(Number);
  const [dm, ds] = cfg.dur.split(':').map(Number);
  const fill = Math.round(((pm * 60 + ps) / (dm * 60 + ds)) * 100);
  wrap.innerHTML = `
    <div class="cam" style="transform:translate(960px,540px) scale(${cfg.s}) translate(${-cfg.fx}px,${-cfg.fy}px)">
      <div class="page">
        <div class="title">${cfg.title}<span class="chev">${icon('CaretDown',20)}</span></div>
        <p class="reciter">${cfg.reciter}<span class="chev">${icon('CaretDown',20)}</span></p>
        <div class="col" style="transform:translateX(${cfg.shift}px)">
          <div class="ribbon" data-wave="${cfg.wave}"></div>
          <div class="scrub">
            <span class="t">${cfg.pos}</span>
            <span class="rail"><i style="width:${fill}%"></i></span>
            <span class="t">${cfg.dur}</span>
          </div>
          <div class="transport">
            <span class="ghost">${icon('CaretRight',20)}</span>
            <span class="ghost" dir="ltr">−15</span>
            <span class="play">${icon('Pause',24)}</span>
            <span class="ghost" dir="ltr">+15</span>
            <span class="ghost">${icon('CaretLeft',20)}</span>
          </div>
        </div>
        <div class="foot"><div class="in">
          <div class="names">
            <b>${icon('BookOpen',20)}${cfg.title}</b>
            <span>${icon('Microphone',16)}${cfg.reciter}</span>
          </div>
          <span class="btn">${icon('SpeakerHigh',20)}</span>
          <span class="ring">
            <svg class="track" viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-opacity=".22" stroke-width="2"/><circle cx="22" cy="22" r="20" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="${cfg.panel ? 125.6 : 62}"/></svg>
            <span class="glyph">${ringGlyph(cfg.panel)}</span>
          </span>
        </div></div>
        ${panelFor(cfg.panel)}
      </div>
      ${cfg.cursor ? `<svg class="cursor" style="left:${cfg.cursor[0]}px;top:${cfg.cursor[1]}px" viewBox="0 0 26 34"><path d="M3 1.5 L3 25.5 L9.1 19.9 L13.1 29.6 L17.4 27.8 L13.5 18.3 L21.7 18.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>` : ''}
    </div>
    ${cfg.cursor ? '' : ''}
    <div class="light"></div>
    <div class="grain"></div>
    ${cfg.mark ? `<div class="mark" style="top:165px;width:538px"><img src="brand/logo/logo.png" alt="تلاوة"></div>` : ''}
    `;
  document.getElementById('out').appendChild(wrap);
  drawRibbon(wrap.querySelector(`.ribbon[data-wave="${cfg.wave}"]`), window.WPS[cfg.wave]);
}

SCENES.forEach(scene);
</script>
</body>
</html>
