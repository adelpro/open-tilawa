server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the SPA entry point so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets (content-hashed filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|torrent)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
