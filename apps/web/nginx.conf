server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the SPA entry point so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # WebTorrent streaming service worker. Never cache it: a pinned copy would
  # keep serving torrents with a stale worker version.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires 0;
  }

  # Workbox runtime imported by sw.js. Content-hashed, but keep it fresh so a
  # worker update is never half-applied.
  location ~* ^/workbox-[^/]+\.js$ {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  # Streaming URLs are answered by the service worker. If a request reaches
  # nginx (worker not active yet) fail instead of returning the SPA shell.
  location /webtorrent/ {
    return 404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets (content-hashed filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|torrent)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
