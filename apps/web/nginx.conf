server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects are written relative: TLS terminates at the edge/Cloudflare, so nginx
  # only ever sees http and an absolute Location would send a visitor to http://.
  absolute_redirect off;

  # One form per page. A prerendered page lives in `about/`, so `/about/` is also a
  # real resource on disk; without this the same page answers 200 under two URLs and
  # the sitemap's form is the one nobody links to. The redirect happens here, before
  # a location can serve either form.
  rewrite ^/(.+)/$ /$1 permanent;

  # Never cache the SPA entry point so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # WebTorrent streaming service worker. Never cache it: a pinned copy would
  # keep serving torrents with a stale worker version.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires 0;
  }

  # Workbox runtime imported by sw.js. Content-hashed, but keep it fresh so a
  # worker update is never half-applied.
  location ~* ^/workbox-[^/]+\.js$ {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  # Streaming URLs are answered by the service worker. If a request reaches
  # nginx (worker not active yet) fail instead of returning the SPA shell.
  location /webtorrent/ {
    return 404;
  }

  # Torrent payload for the web seed. The server-level root already points at
  # the mounted volume, so /media/<folder>/<file> resolves without an alias
  # (alias + try_files is the trap this avoids). Range and MIME are nginx
  # defaults; the rate cap keeps one listener from saturating the line.
  location /media/ {
    try_files $uri =404;
    limit_rate 1m;
    add_header Cache-Control "public, max-age=3600";
    # The corpus is public and carries no credentials. The staging channel
    # reads it as its web seed, and magnets carry absolute tilawah.cc web-seed
    # URLs, so the request is cross-origin by construction.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    # `Cache-Control` is not optional here. A browser fetch with `cache: 'no-store'`
    # — which is what the torrent's HTTP source uses — sends `Cache-Control: no-cache`
    # on the preflight, and a list of `Range` alone fails that preflight, so every
    # cross-origin media request dies before the first byte. `If-Range` arrives with
    # a resumed range; the rest are the ordinary negotiation headers a media fetch
    # may add. Exposing length/range lets the source size the response it received.
    add_header Access-Control-Allow-Headers "Range, If-Range, Cache-Control, Pragma, Accept, Accept-Encoding, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
    # One preflight per file per day instead of one per range request.
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  # The prerendered 404 page. Without this, nginx answers with its own bare error page and
  # the visitor loses the way back into the app.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # A sitemap served as text/plain is ignored by some crawlers.
  location = /sitemap.xml {
    default_type application/xml;
  }

  location = /robots.txt {
    default_type text/plain;
  }

  # Page paths. A prerendered page is a directory with its own index.html; name that
  # file directly. Naming the directory (`$uri/`) makes nginx treat it as the resource
  # and answer `/about` with a 301 to `/about/` — every page then lives at a URL the
  # sitemap does not list. Anything with no page behind it is a real 404. The shell
  # fallback is deliberately NOT at this level: a mistyped path answered with the
  # player and a 200 is a soft 404, which is how a site teaches a crawler that every
  # URL it can invent is a page.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # The families the app owns: the parameters live in the path, so nginx cannot know
  # whether `/listen/<slug>/<n>` exists and must hand it to the shell.
  #
  # This list is every route the app resolves today, not only the parameterised ones,
  # because the prerendered copies do not exist until the build starts writing them.
  # When it does, this narrows to the families that genuinely need the shell and a
  # missing prerendered page becomes a 404 instead of a silent fallback that hides
  # the bug.
  location ~ ^/(listen|reciters|surahs|about|privacy|settings|account|favorites|recent)(/|$) {
    try_files $uri $uri/index.html /index.html;
  }

  # A .torrent is content-addressed but not immutable: its announce list is
  # maintained, and a year-long cache once served a broken file to every client.
  # The client adds ?v=<version> so a corrected file always busts the cache.
  location ~* \.torrent$ {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  # Cache static assets (content-hashed filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
