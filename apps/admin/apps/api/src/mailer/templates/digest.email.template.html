<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1d1d1f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <tr><td style="padding:28px 32px 8px;">
          <p style="margin:0;font-size:20px;font-weight:700;color:#086288;letter-spacing:-0.01em;">{{APP_NAME}}</p>
        </td></tr>
        <tr><td style="padding:8px 32px 28px;">
          <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;">{{heading}}</h1>
          <p style="margin:0 0 16px;line-height:1.6;">{{summary}}</p>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;line-height:1.5;border-top:1px solid #e5e5ea;">
            {{rows}}
          </table>
          <p style="margin:16px 0 0;"><a href="{{consoleUrl}}" style="color:#086288;">Open the console</a></p>
        </td></tr>
        <tr><td style="padding:16px 32px;background:#f5f5f7;font-size:12px;color:#6e6e73;text-align:center;">
          &copy; {{APP_NAME}} &middot; One status mail a day, sent to {{email}} because the account holds an admin role. &middot; <a href="mailto:contact@tilawah.cc" style="color:#6e6e73;">contact@tilawah.cc</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
