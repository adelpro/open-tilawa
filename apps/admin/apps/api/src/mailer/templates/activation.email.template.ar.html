<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تنشيط حسابك في {{APP_NAME}}</title>
</head>
<body dir="rtl" style="margin:0;padding:0;background:#f5f5f7;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1d1d1f;text-align:right;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);">
        <tr><td style="padding:28px 32px 8px;text-align:right;">
          <p style="margin:0;font-size:20px;font-weight:700;color:#086288;letter-spacing:-0.01em;">{{APP_NAME}}</p>
        </td></tr>
        <tr><td style="padding:8px 32px 28px;text-align:right;">
          <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;">تنشيط حسابك</h1>
<p style="margin:0 0 12px;line-height:1.6;">مرحبًا {{name}}،</p>
<p style="margin:0 0 12px;line-height:1.6;">شكرًا لتسجيلك في {{APP_NAME}}. للوصول إلى حسابك الجديد، نشّطه بالضغط على الزر أدناه.</p>
<p style="margin:0 0 12px;line-height:1.6;font-size:14px;color:#6e6e73;">بعد الضغط ستُنقل إلى صفحة التنشيط.</p>
          
        <p style="text-align:center;margin:24px 0;">
          <a href="{{website}}/me/account-activation/{{token}}" style="display:inline-block;background:#086288;color:#fff;padding:12px 28px;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">تنشيط الحساب</a>
        </p>
        </td></tr>
        <tr><td style="padding:16px 32px;background:#f5f5f7;font-size:12px;color:#6e6e73;text-align:center;">
          &copy; {{APP_NAME}} &middot; أُرسل هذا البريد إلى {{email}}.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
