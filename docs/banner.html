<!doctype html>
<!--
  Banner source. Render it with `node docs/banner-render.mjs`, which writes
  apps/web/public/banner.png (1280x640 @2x) — the file the README shows and
  https://tilawah.cc/banner.png serves.
  Everything it needs lives in this repo: the wordmark, IBM Plex Sans Arabic
  from apps/web/public/fonts, and a real capture of tilawah.cc.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Four faces, both scripts: a Latin-only subset would drop the phone's
         Arabic UI to the system font. */
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-weight: 400;
        src: url('../apps/web/public/fonts/Qw3CZRtWPQCuHme67tEYUIx3Kh0PHR9N6Ys43PWrfQ.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-weight: 400;
        src: url('../apps/web/public/fonts/Qw3CZRtWPQCuHme67tEYUIx3Kh0PHR9N6Ys93PU.woff2') format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-weight: 600;
        src: url('../apps/web/public/fonts/Qw3NZRtWPQCuHme67tEYUIx3Kh0PHR9N6YPi-OCRXMR5Kw.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
      }
      @font-face {
        font-family: 'IBM Plex Sans Arabic';
        font-weight: 600;
        src: url('../apps/web/public/fonts/Qw3NZRtWPQCuHme67tEYUIx3Kh0PHR9N6YPi-OCUXMQ.woff2') format('woff2');
        unicode-range: U+0000-00FF;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --hairline: #e0e0e0;
        --paper: #ffffff;
        --parchment: #f5f5f7;
        --wave-front: #1c4d78;
        --wave-back: #5d97c9;
      }

      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--paper);
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      .banner {
        position: relative;
        width: 1280px;
        height: 640px;
      }

      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(760px 560px at 84% 44%, #f6f7f9 0%, rgba(255, 255, 255, 0) 68%),
          radial-gradient(560px 420px at 4% 6%, #fafafc 0%, rgba(255, 255, 255, 0) 70%);
      }

      .copy {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-58%);
        width: 604px;
        z-index: 3;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 30px;
      }

      .lockup img { height: 34px; width: auto; display: block; }

      .lockup .rule { width: 1px; height: 24px; background: var(--hairline); }

      .lockup .word {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding-top: 2px;
      }

      h1 {
        font-size: 30px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 16px;
      }

      p.lede {
        font-size: 17px;
        line-height: 1.6;
        color: var(--ink-soft);
        max-width: 552px;
        text-wrap: pretty;
      }

      /* The label: the two addresses, set as one quiet chip. */
      .label {
        position: absolute;
        left: 72px;
        bottom: 46px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        font-size: 12.5px;
        color: var(--ink);
        z-index: 4;
      }

      .label .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--ink-soft);
        flex: none;
      }

      .label .site { font-weight: 600; }

      .mono { direction: ltr; unicode-bidi: isolate; }

      .phone {
        position: absolute;
        right: 104px;
        top: 50%;
        transform: translateY(-50%);
        width: 286px;
        padding: 9px;
        border-radius: 44px;
        background: #111113;
        box-shadow:
          0 34px 70px rgba(16, 24, 40, 0.2),
          0 2px 6px rgba(16, 24, 40, 0.14),
          inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        z-index: 2;
      }

      .phone img { display: block; width: 100%; border-radius: 36px; }

      .phone::after {
        /* The camera island: without one it reads as a screenshot in a box. */
        content: '';
        position: absolute;
        top: 19px;
        left: 50%;
        transform: translateX(-50%);
        width: 82px;
        height: 21px;
        border-radius: 999px;
        background: #111113;
      }

      /* The ribbon sits behind the phone and dies out before it reaches the copy,
         so the label never has to fight it. */
      .waves {
        position: absolute;
        right: -40px;
        bottom: -34px;
        width: 780px;
        height: 300px;
        z-index: 1;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 42%);
        mask-image: linear-gradient(to right, transparent 0%, #000 42%);
      }

      .waves svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="wash"></div>

      <div class="waves">
        <svg viewBox="0 0 780 300" preserveAspectRatio="none" aria-hidden="true">
          <g id="layers"></g>
        </svg>
      </div>

      <div class="copy">
        <div class="lockup">
          <img src="../apps/web/public/images/icon.png" alt="تلاوة" />
          <span class="rule"></span>
          <span class="word">Open Tilawa</span>
        </div>

        <h1>Self-hostable infrastructure for the Open Tilawa WebTorrent stack</h1>

        <p class="lede">
          A peer-to-peer Quran recitation player that streams audio from WebTorrent peers, with
          the operator's own node as the HTTP safety net.
        </p>
      </div>

      <div class="phone">
        <img
          src="../apps/web/public/screenshots/player-narrow.png"
          alt="Tilawah playing Surah Al-Fatiha"
        />
      </div>

      <div class="label">
        <span class="mono">contact@tilawah.cc</span>
        <span class="dot"></span>
        <span class="mono site">tilawah.cc</span>
      </div>
    </div>

    <script>
      /**
       * The app's spectrum ribbon in miniature: four silhouettes sharing one
       * signal, drawn back to front, tints mixed from the two brand tokens
       * exactly as `waveTints()` does it.
       */
      const front = [28, 77, 120];
      const back = [93, 151, 201];

      const mix = (t) =>
        front
          .map((channel, index) => Math.round(channel + (back[index] - channel) * t))
          .map((value) => value.toString(16).padStart(2, '0'))
          .join('');

      const layers = [
        { gain: 1, shift: 0, phase: 0.4, opacity: 0.42 },
        { gain: 0.8, shift: 44, phase: 1.9, opacity: 0.46 },
        { gain: 0.6, shift: 104, phase: 3.4, opacity: 0.5 },
        { gain: 0.42, shift: 172, phase: 5.1, opacity: 0.56 },
      ];

      const width = 780;
      const height = 300;
      const target = document.getElementById('layers');
      const NS = 'http://www.w3.org/2000/svg';

      layers.forEach((layer, index) => {
        const points = [];
        for (let x = 0; x <= width; x += 6) {
          const s = (x + layer.shift) / width;
          const y =
            height -
            (18 +
              (Math.sin(s * 13.5 + layer.phase) * 0.5 + 0.5) * 92 * layer.gain +
              Math.sin(s * 34.2 + layer.phase * 1.7) * 20 * layer.gain +
              Math.sin(s * 71.5 + layer.phase * 0.6) * 9 * layer.gain);
          points.push([x, y]);
        }

        const d =
          points.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x} ${y.toFixed(1)}`).join(' ') +
          ` L${width} ${height} L0 ${height} Z`;

        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', '#' + mix(index / (layers.length - 1)));
        path.setAttribute('opacity', String(layer.opacity));
        target.appendChild(path);
      });
    </script>
  </body>
</html>
