/* ---------------------------------------------------------------- renderer */
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(svg, x, y, s, size, fill, o) {
  o = o || {};
  const t = mk('text', Object.assign({
    x: x, y: y, 'font-size': size, fill: fill || INK,
    'font-family': '"Helvetica Neue", Helvetica, Arial, sans-serif',
    'letter-spacing': o.ls == null ? '.02em' : o.ls,
    'font-weight': o.w || 400,
    'text-anchor': o.anchor || 'start'
  }, o.attrs || {}), svg);
  t.textContent = s;
  return t;
}

function render(sheet) {
  const sec = document.createElement('section');
  sec.className = 'sheet';
  sec.id = sheet.id;

  const svg = mk('svg', { width: 1600, height: 1000, viewBox: '0 0 1600 1000' }, sec);
  const defs = mk('defs', {}, svg);
  const m = mk('marker', { id: 'ar-' + sheet.id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' }, defs);
  mk('path', { d: 'M1,1.5 L9,5 L1,8.5 z', fill: INK }, m);

  txt(svg, 120, 108, sheet.title, 30, INK, { ls: '.16em' });
  txt(svg, 120, 138, sheet.sub, 15, GRAY, { ls: '.01em' });

  // frames go under everything
  (sheet.frames || (sheet.frame ? [sheet.frame] : [])).forEach(f => {
    mk('rect', { x: f.x, y: f.y, width: f.w, height: f.h, rx: 22, fill: 'none', stroke: INK, 'stroke-width': 1.2 }, svg);
    txt(svg, f.x + 24, f.y + 32, f.label, 12, GRAY, { ls: '.2em' });
  });

  (sheet.links || []).forEach(l => {
    const pts = [l.from].concat(l.via || []).concat([l.to]);
    mk('polyline', {
      points: pts.map(p => p[0] + ',' + p[1]).join(' '),
      fill: 'none', stroke: l.dashed ? GRAY : INK,
      'stroke-width': l.dashed ? 1.1 : 1.4,
      'stroke-dasharray': l.dashed ? '7 5' : null,
      'marker-end': l.plain ? null : 'url(#ar-' + sheet.id + ')',
      'stroke-linejoin': 'round'
    }, svg);
    if (l.label) {
      const a = pts[0], b = pts[pts.length - 1];
      txt(svg, l.lx == null ? (a[0] + b[0]) / 2 : l.lx, l.ly == null ? (a[1] + b[1]) / 2 - 10 : l.ly, l.label, 12, GRAY, { anchor: 'middle', ls: '.04em' });
    }
  });

  sheet.boxes.forEach(b => {
    const t = 14, s = 12.5;
    mk('rect', {
      x: b.x, y: b.y, width: b.w, height: b.h, rx: b.nested ? 14 : 12,
      fill: b.plate ? FAINT : '#fff', stroke: b.dashed ? GRAY : INK,
      'stroke-width': b.dashed ? 1.1 : 1.5,
      'stroke-dasharray': b.dashed ? '7 5' : null
    }, svg);

    if (b.nested) {
      txt(svg, b.x + 24, b.y + 32, b.label, 12, GRAY, { ls: '.2em' });
      return;
    }

    const lines = b.sub || [];
    const blockH = t + (lines.length ? lines.length * 18 + 6 : 0);

    if (b.align === 'left') {
      const x = b.x + 32;
      const cy = b.y + b.h / 2 - blockH / 2 + t * 0.85;
      txt(svg, x, cy, b.title, 16, INK, { ls: '.14em', attrs: { style: 'text-transform:uppercase' } });
      lines.forEach((ln, i) => txt(svg, x, cy + 26 + i * 20, ln, 13.5, GRAY, { ls: '.01em' }));
      return;
    }

    const cy = b.y + b.h / 2 - blockH / 2 + t * 0.85;
    txt(svg, b.x + b.w / 2, cy, b.title, t, INK, { anchor: 'middle', ls: '.12em', attrs: { style: 'text-transform:uppercase' } });
    lines.forEach((ln, i) => txt(svg, b.x + b.w / 2, cy + 22 + i * 18, ln, s, GRAY, { anchor: 'middle', ls: '.01em' }));
  });

  (sheet.notes || []).forEach(([x, y, s]) => txt(svg, x, y, s, 13, GRAY, { ls: '.01em' }));

  txt(svg, 120, 946, 'open-tilawa · how it works', 11, '#9a9a9a', { ls: '.16em' });
  txt(svg, 1480, 946, sheet.file, 11, '#9a9a9a', { ls: '.16em', anchor: 'end' });

  return sec;
}

const root = document.getElementById('root');
SHEETS.forEach(s => root.appendChild(render(s)));
window.__SHEETS__ = SHEETS.map(s => s.id);
window.__READY__ = true;
